# Artifact-only bridge derived from Epoch-ML/ztc-releases policy
# bedcdd03c6358268253ad8bf8d465427ee90c69e. Legacy release/feed paths are unchanged.
name: Build and sign ZTC bridge

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        required: true
        default: preview
        options:
          - preview
          - stable
      version:
        description: Strict SemVer without a v prefix
        type: string
        required: true
      source_sha:
        description: Exact 40-character Epoch-ML/zerg commit SHA
        type: string
        required: true

concurrency:
  group: zterm-desktop-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate immutable request
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.request.outputs.channel }}
      release_tag: ${{ steps.request.outputs.release_tag }}
      requested_at: ${{ steps.request.outputs.requested_at }}
      release_target_sha: ${{ steps.request.outputs.release_target_sha }}
      source_ref: ${{ steps.request.outputs.source_ref }}
      source_sha: ${{ steps.request.outputs.source_sha }}
      version: ${{ steps.request.outputs.version }}
      npm_version: ${{ steps.request.outputs.npm_version }}
      npm_integrity: ${{ steps.request.outputs.npm_integrity }}
      npm_tarball: ${{ steps.request.outputs.npm_tarball }}
    steps:
      # Product policy is immutable executable code; requests are data from the
      # independently protected public distribution repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Epoch-ML/ztc-releases
          ref: bedcdd03c6358268253ad8bf8d465427ee90c69e
          path: release-index
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Epoch-ML/ztc-releases
          ref: main
          path: request-index
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: release-index/package-lock.json

      - name: Install and audit locked release policy dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix release-index
          npm audit --audit-level=moderate --prefix release-index

      - name: Test release policy
        run: npm test --prefix release-index

      - id: request
        name: Resolve and validate exactly one request
        working-directory: request-index
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          request_path="$RUNNER_TEMP/release-request.json"

          if [[ "$GITHUB_REPOSITORY" != "Epoch-ML/zterm-releases" || "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::public releases must be dispatched from protected main"
            exit 1
          fi
          if [[ "$INPUT_CHANNEL" == "stable" ]]; then
            release_tag="ztc-desktop-v${INPUT_VERSION}"
          elif [[ "$INPUT_CHANNEL" == "preview" ]]; then
            release_tag="ztc-desktop-preview-v${INPUT_VERSION}"
          else
            echo "::error::release channel must be preview or stable"
            exit 1
          fi
          candidate="requests/${release_tag}.json"
          if [[ -L "$candidate" || ! -f "$candidate" ]]; then
            echo "::error::release dispatch requires the existing immutable $candidate"
            exit 1
          fi

          if [[ ! "$candidate" =~ ^requests/[0-9A-Za-z._+-]+\.json$ || -L "$candidate" || ! -f "$candidate" ]]; then
            echo "::error::the request must be one regular non-symlink requests/*.json file"
            exit 1
          fi
          mapfile -t addition_commits < <(
            git log --format=%H --diff-filter=A -- "$candidate"
          )
          if [[ ${#addition_commits[@]} -ne 1 ]]; then
            echo "::error::the request must have exactly one immutable addition commit"
            exit 1
          fi
          request_commit="${addition_commits[0]}"
          git merge-base --is-ancestor "$request_commit" "$(git rev-parse HEAD)"
          read -r -a commit_and_parents <<<"$(git rev-list --parents -n 1 "$request_commit")"
          if [[ ${#commit_and_parents[@]} -ne 2 ]]; then
            echo "::error::the request addition must be a single-parent commit"
            exit 1
          fi
          mapfile -d '' -t addition_changes < <(
            git diff --name-status --no-renames -z \
              "${request_commit}^" "$request_commit"
          )
          if [[
            ${#addition_changes[@]} -ne 2 ||
            "${addition_changes[0]}" != "A" ||
            "${addition_changes[1]}" != "$candidate"
          ]]; then
            echo "::error::the request addition commit must add only this request"
            exit 1
          fi
          request_mode="$(git ls-tree "$request_commit" -- "$candidate" | cut -d ' ' -f 1)"
          if [[ "$request_mode" != "100644" ]]; then
            echo "::error::the immutable request must be a normal non-executable file"
            exit 1
          fi
          addition_bytes="$RUNNER_TEMP/zterm-request-at-addition.json"
          git show "${request_commit}:$candidate" >"$addition_bytes"
          cmp --silent "$candidate" "$addition_bytes" || {
            echo "::error::request bytes changed after their immutable addition commit"
            exit 1
          }

          node ../release-index/scripts/release-request.mjs "$candidate" >"$request_path"
          jq -e \
            --arg channel "$INPUT_CHANNEL" \
            --arg version "$INPUT_VERSION" \
            --arg source_sha "$INPUT_SOURCE_SHA" \
            '.channel == $channel and .version == $version and .source_sha == $source_sha' \
            "$request_path" >/dev/null || {
              echo "::error::dispatch inputs do not exactly match the immutable request"
              exit 1
            }

          release_tag="$(jq -r .release_tag "$request_path")"
          if [[ "$candidate" != "requests/${release_tag}.json" ]]; then
            echo "::error::request filename must be requests/${release_tag}.json"
            exit 1
          fi
          remote_refs="$(
            git ls-remote --tags origin \
              "refs/tags/$release_tag" "refs/tags/$release_tag^{}"
          )"
          tag_object="$(
            awk -v ref="refs/tags/$release_tag" '$2 == ref { print $1 }' \
              <<<"$remote_refs"
          )"
          tag_commit="$(
            awk -v ref="refs/tags/$release_tag^{}" '$2 == ref { print $1 }' \
              <<<"$remote_refs"
          )"
          if [[ -n "$tag_commit" ]]; then
            tag_target="$tag_commit"
          else
            tag_target="$tag_object"
          fi
          if [[ -z "$tag_target" ]]; then
            echo "::error::public release tag $release_tag does not exist"
            exit 1
          fi
          if [[ "$tag_target" != "$request_commit" ]]; then
            echo "::error::public release tag must point to the immutable request addition commit"
            exit 1
          fi
          {
            echo "release_target_sha=$request_commit"
            echo "npm_version=$(jq -r .npm.version "$request_path")"
            echo "npm_integrity=$(jq -r .npm.integrity "$request_path")"
            echo "npm_tarball=$(jq -r .npm.tarballUrl "$request_path")"
          } >>"$GITHUB_OUTPUT"
          for field in channel release_tag requested_at source_ref source_sha version; do
            printf '%s=%s\n' "$field" "$(jq -r ".$field" "$request_path")" \
              >>"$GITHUB_OUTPUT"
          done

  build:
    name: Build Apple Silicon release
    needs: validate
    runs-on: macos-15
    environment: zterm-source
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      RUST_TOOLCHAIN: "1.94.1"
      ZTERM_BUNDLE_ROOT: ${{ github.workspace }}/source/ztc/dist/zterm-release-bundle
      ZTERM_RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
      ZTERM_RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      ZTERM_SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
      ZTERM_UPDATE_CHANNEL: ${{ needs.validate.outputs.channel }}
      ZTERM_VERSION: ${{ needs.validate.outputs.version }}
      ZTC_DESKTOP_NPM_VERSION: ${{ needs.validate.outputs.npm_version }}
      ZTC_DESKTOP_NPM_INTEGRITY: ${{ needs.validate.outputs.npm_integrity }}
      ZTC_DESKTOP_NPM_URL: ${{ needs.validate.outputs.npm_tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Epoch-ML/ztc-releases
          ref: bedcdd03c6358268253ad8bf8d465427ee90c69e
          path: release-index
          persist-credentials: false

      - name: Require source credential and Apple Silicon
        env:
          SOURCE_DEPLOY_KEY: ${{ secrets.ZERG_SOURCE_DEPLOY_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "arm64" ]] || {
            echo "::error::the release runner must be Apple Silicon"
            exit 1
          }
          if [[ -z "$SOURCE_DEPLOY_KEY" ]]; then
            echo "::error::required release secret is unavailable: SOURCE_DEPLOY_KEY"
            exit 1
          fi

      - name: Check out the exact source commit and tag
        env:
          EXPECTED_REF: ${{ needs.validate.outputs.source_ref }}
          EXPECTED_SHA: ${{ needs.validate.outputs.source_sha }}
          GITHUB_META_TOKEN: ${{ github.token }}
          SOURCE_DEPLOY_KEY: ${{ secrets.ZERG_SOURCE_DEPLOY_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/zterm-source-deploy-key"
          known_hosts_path="$RUNNER_TEMP/zterm-github-known-hosts"
          github_meta_path="$RUNNER_TEMP/zterm-github-meta.json"
          cleanup() {
            rm -f "$key_path" "$known_hosts_path" "$github_meta_path"
          }
          trap cleanup EXIT

          umask 077
          printf '%s\n' "$SOURCE_DEPLOY_KEY" >"$key_path"
          curl --fail --silent --show-error --location --retry 3 \
            --proto '=https' --tlsv1.2 \
            --header "Authorization: Bearer $GITHUB_META_TOKEN" \
            https://api.github.com/meta >"$github_meta_path"
          jq -er \
            '.ssh_keys[] | select(startswith("ssh-ed25519 ")) | "github.com " + .' \
            "$github_meta_path" >"$known_hosts_path"
          ssh-keygen -F github.com -f "$known_hosts_path" >/dev/null

          export GIT_SSH_COMMAND="ssh -i $key_path -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts_path"
          git init --ref-format=reftable source
          git -C source remote add origin git@github.com:Epoch-ML/zerg.git
          git -C source fetch --no-tags --depth=1 origin "$EXPECTED_SHA"
          git -C source fetch --no-tags --depth=1 origin "$EXPECTED_REF:$EXPECTED_REF"
          GIT_LFS_SKIP_SMUDGE=1 git -C source checkout --detach "$EXPECTED_SHA"

      - name: Verify source commit, tag, and updater trust root
        env:
          EXPECTED_REF: ${{ needs.validate.outputs.source_ref }}
          EXPECTED_SHA: ${{ needs.validate.outputs.source_sha }}
          RELEASE_CHANNEL: ${{ needs.validate.outputs.channel }}
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git -C source rev-parse HEAD)"
          tag_sha="$(git -C source rev-list -n 1 "$EXPECTED_REF")"
          [[ "$actual_sha" == "$EXPECTED_SHA" ]]
          [[ "$tag_sha" == "$EXPECTED_SHA" ]]
          cmp "release-index/updater-$RELEASE_CHANNEL.pubkey" \
            "source/ztc/packages/zterm/updater-$RELEASE_CHANNEL.pubkey"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: source/ztc/package-lock.json

      - name: Install locked Node dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund --prefix source/ztc
          # Colony embeds this ZTC production tree even though ztc.app excludes Node.
          npm audit --omit=dev --audit-level=moderate --prefix source/ztc

      - name: Download pinned bundled Node and exact published agent
        shell: bash
        run: |
          set -euo pipefail
          node_archive="$RUNNER_TEMP/node-v22.23.2-darwin-arm64.tar.gz"
          curl --fail --location --proto '=https' --proto-redir '=https' --max-time 180 --output "$node_archive" https://nodejs.org/dist/v22.23.2/node-v22.23.2-darwin-arm64.tar.gz
          echo "61130f394c1630d211dd50aecc4353d379480f36d3ac913cd85dbba1aed585c6  $node_archive" | shasum -a 256 -c -
          tar -xzf "$node_archive" -C "$RUNNER_TEMP"
          curl --fail --location --proto '=https' --proto-redir '=https' --max-time 180 --output "$RUNNER_TEMP/ztc-npm.tgz" "$ZTC_DESKTOP_NPM_URL"
          echo "ZTC_DESKTOP_NODE_ROOT=$RUNNER_TEMP/node-v22.23.2-darwin-arm64" >> "$GITHUB_ENV"
          echo "ZTC_DESKTOP_NPM_TARBALL=$RUNNER_TEMP/ztc-npm.tgz" >> "$GITHUB_ENV"

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustup target add aarch64-apple-darwin --toolchain "$RUST_TOOLCHAIN"
          rustup component add rustfmt clippy --toolchain "$RUST_TOOLCHAIN"
          [[ "$(rustc -vV | sed -n 's/^host: //p')" == "aarch64-apple-darwin" ]]

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: zterm-${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('source/ztc/packages/zterm/Cargo.lock') }}
          restore-keys: |
            zterm-${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST_TOOLCHAIN }}-

      - name: Install release audit tools
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-audit --version 0.22.2 --locked

      - name: Test, lint, and audit ZTC
        working-directory: source/ztc
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test \
            tests/unit/zterm_release.test.ts \
            tests/unit/zterm_release_rerun.test.ts \
            tests/unit/zterm_source_release_workflow.test.ts \
            tests/unit/ztc_public_release.test.ts \
            tests/unit/published_desktop_runtime.test.ts \
            tests/unit/desktop_public_installer.test.ts \
            tests/unit/zterm_desktop_runtime_package.test.ts
          cargo test --locked --manifest-path packages/zterm/Cargo.toml
          cargo fmt --manifest-path packages/zterm/Cargo.toml -- --check
          cargo clippy \
            --locked \
            --manifest-path packages/zterm/Cargo.toml \
            --all-targets \
            -- \
            -D warnings
          # quick-xml enters the all-target lockfile only through Linux Wayland code.
          quick_xml_tree="$(
            cargo tree --target all -i quick-xml \
              --locked --manifest-path packages/zterm/Cargo.toml
          )"
          grep -F "wayland-scanner" <<<"$quick_xml_tree"
          macos_quick_xml_tree="$(
            cargo tree --target aarch64-apple-darwin -i quick-xml \
              --locked --manifest-path packages/zterm/Cargo.toml 2>&1
          )"
          grep -F "nothing to print" <<<"$macos_quick_xml_tree"
          cargo audit --file packages/zterm/Cargo.lock \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195
          npm run test:zterm:smoke

      - name: Build release-stamped native binary
        working-directory: source/ztc
        shell: bash
        run: |
          set -euo pipefail
          cargo build \
            --locked \
            --release \
            --target aarch64-apple-darwin \
            --manifest-path packages/zterm/Cargo.toml
          binary="packages/zterm/target/aarch64-apple-darwin/release/zterm"
          [[ -x "$binary" ]]
          [[ "$(file -b "$binary")" == *"arm64"* ]]
          [[ "$($binary --version)" == "zterm-$ZTERM_RELEASE_VERSION" ]]

      - name: Package unsigned ztc.app
        working-directory: source/ztc
        env:
          ZTERM_BINARY_PATH: packages/zterm/target/aarch64-apple-darwin/release/zterm
          ZTERM_BUNDLE_DIR: ${{ env.ZTERM_BUNDLE_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/package-zterm-macos.mjs
          app="$ZTERM_BUNDLE_ROOT/ztc.app"
          executable="$app/Contents/MacOS/ZTerm"
          [[ "$($executable --version)" == "zterm-$ZTERM_RELEASE_VERSION" ]]
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' \
            "$app/Contents/Info.plist" | grep -Fx dev.zerg.zterm
          expected_bundle_version="${ZTERM_RELEASE_VERSION%%[-+]*}"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            "$app/Contents/Info.plist" | grep -Fx "$expected_bundle_version"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' \
            "$app/Contents/Info.plist" | grep -Fx "$expected_bundle_version"

      - name: Smoke test the unsigned build before credential isolation
        working-directory: source/ztc
        shell: bash
        run: |
          set -euo pipefail
          ZTERM_SMOKE_BINARY="$ZTERM_BUNDLE_ROOT/ztc.app/Contents/MacOS/ZTerm" \
            node tests/sim/smoke-zterm-desktop.mjs

      - name: Preserve executable modes for signer transfer
        shell: bash
        run: COPYFILE_DISABLE=1 tar -czf source/ztc/dist/zterm-release-bundle/ztc-unsigned.tar.gz -C source/ztc/dist/zterm-release-bundle ztc.app

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        name: Upload unsigned ZTC application
        with:
          name: ${{ needs.validate.outputs.release_tag }}-unsigned-app
          path: source/ztc/dist/zterm-release-bundle/ztc-unsigned.tar.gz
          if-no-files-found: error
          retention-days: 14

  apple-sign:
    name: Sign and notarize without executing product source
    needs:
      - validate
      - build
    runs-on: macos-15
    environment:
      name: zterm-apple-stable
    permissions:
      contents: read
    env:
      RELEASE_CHANNEL: ${{ needs.validate.outputs.channel }}
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Epoch-ML/ztc-releases
          ref: bedcdd03c6358268253ad8bf8d465427ee90c69e
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.validate.outputs.release_tag }}-unsigned-app
          path: unsigned-transfer

      - name: Validate the non-executable product payload
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/unpack-unsigned.py unsigned-transfer/ztc-unsigned.tar.gz unsigned
          app="$GITHUB_WORKSPACE/unsigned/ztc.app"
          test -d "$app"
          node scripts/inspect-bundle.mjs "$app" "$RELEASE_VERSION" "$SOURCE_SHA" > "$RUNNER_TEMP/native-payloads.txt"
          expected_bundle_version="${RELEASE_VERSION%%[-+]*}"
          printf '%s\n' "$expected_bundle_version" \
            | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' \
            "$app/Contents/Info.plist" | grep -Fx dev.zerg.zterm
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' \
            "$app/Contents/Info.plist" | grep -Fx ZTerm
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            "$app/Contents/Info.plist" | grep -Fx "$expected_bundle_version"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' \
            "$app/Contents/Info.plist" | grep -Fx "$expected_bundle_version"

      - name: Require and import stable Apple identity
        env:
          APPLE_API_ISSUER_SECRET: ${{ secrets.ZTERM_APPLE_API_ISSUER }}
          APPLE_API_KEY_ID_SECRET: ${{ secrets.ZTERM_APPLE_API_KEY_ID }}
          APPLE_API_PRIVATE_KEY_SECRET: ${{ secrets.ZTERM_APPLE_API_PRIVATE_KEY }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.ZTERM_APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD_SECRET: ${{ secrets.ZTERM_APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.ZTERM_APPLE_SIGNING_IDENTITY }}
        shell: bash
        run: |
          set -euo pipefail
          for variable_name in \
            APPLE_API_ISSUER_SECRET \
            APPLE_API_KEY_ID_SECRET \
            APPLE_API_PRIVATE_KEY_SECRET \
            APPLE_CERTIFICATE_BASE64 \
            APPLE_CERTIFICATE_PASSWORD_SECRET \
            APPLE_SIGNING_IDENTITY_SECRET; do
            if [[ -z "${!variable_name}" ]]; then
              echo "::error::stable publication requires $variable_name"
              exit 1
            fi
          done
          [[ "$APPLE_API_KEY_ID_SECRET" =~ ^[0-9A-Za-z]{10,32}$ ]]
          [[ "$APPLE_API_ISSUER_SECRET" =~ ^[0-9A-Fa-f-]{36}$ ]]

          certificate_path="$RUNNER_TEMP/zterm-developer-id.p12"
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID_SECRET}.p8"
          keychain_path="$RUNNER_TEMP/zterm-release.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "ZTERM_APPLE_KEYCHAIN=$keychain_path" >>"$GITHUB_ENV"
          node -e '
            const fs = require("node:fs");
            fs.writeFileSync(process.argv[1], Buffer.from(process.env.APPLE_CERTIFICATE_BASE64, "base64"));
          ' "$certificate_path"
          printf '%s' "$APPLE_API_PRIVATE_KEY_SECRET" >"$api_key_path"
          chmod 600 "$certificate_path" "$api_key_path"
          [[ -s "$certificate_path" && -s "$api_key_path" ]]
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD_SECRET" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" \
            | grep -F -- "\"$APPLE_SIGNING_IDENTITY_SECRET\"" >/dev/null
          {
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER_SECRET"
            echo "APPLE_API_KEY=$APPLE_API_KEY_ID_SECRET"
            echo "APPLE_API_KEY_PATH=$api_key_path"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY_SECRET"
          } >>"$GITHUB_ENV"

      - name: Sign ZTC without launching its executable
        shell: bash
        run: |
          set -euo pipefail
          app="$GITHUB_WORKSPACE/unsigned/ztc.app"
          while IFS= read -r native; do
            if [[ "$native" == "$app/Contents/Resources/runtime/node" ]]; then
              codesign --force --options runtime --timestamp --entitlements scripts/node.entitlements.plist --sign "$APPLE_SIGNING_IDENTITY" "$native"
            else
              codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$native"
            fi
          done < "$RUNNER_TEMP/native-payloads.txt"
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Notarize and staple stable application
        shell: bash
        run: |
          set -euo pipefail
          app="$GITHUB_WORKSPACE/unsigned/ztc.app"
          app_zip="$RUNNER_TEMP/ZTC-notarization.zip"
          result="$RUNNER_TEMP/zterm-app-notarization.json"
          ditto -c -k --keepParent "$app" "$app_zip"
          xcrun notarytool submit "$app_zip" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait --output-format json >"$result"
          jq -e '.status == "Accepted"' "$result" >/dev/null
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app" 2>&1 \
            | grep -F 'source=Notarized Developer ID'

      - name: Create signed updater archive and disk image
        shell: bash
        run: |
          set -euo pipefail
          app="$GITHUB_WORKSPACE/unsigned/ztc.app"
          mkdir payload
          archive="$GITHUB_WORKSPACE/payload/ztc.app.tar.gz"
          dmg="$GITHUB_WORKSPACE/payload/ztc_${RELEASE_VERSION}_aarch64.dmg"
          dmg_root="$RUNNER_TEMP/zterm-dmg-root"
          mkdir -p "$dmg_root"
          COPYFILE_DISABLE=1 tar -C "$GITHUB_WORKSPACE/unsigned" -czf "$archive" ztc.app
          ditto "$app" "$dmg_root/ztc.app"
          ln -s /Applications "$dmg_root/Applications"
          hdiutil create \
            -volname "ZTC" \
            -srcfolder "$dmg_root" \
            -format UDZO \
            -ov "$dmg"
          hdiutil verify "$dmg" >/dev/null

      - name: Notarize and staple stable disk image
        shell: bash
        run: |
          set -euo pipefail
          dmg="$GITHUB_WORKSPACE/payload/ztc_${RELEASE_VERSION}_aarch64.dmg"
          result="$RUNNER_TEMP/zterm-dmg-notarization.json"
          codesign --force --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
          codesign --verify --strict --verbose=2 "$dmg"
          xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait --output-format json >"$result"
          jq -e '.status == "Accepted"' "$result" >/dev/null
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          codesign --verify --strict --verbose=2 "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg" 2>&1 \
            | grep -F 'source=Notarized Developer ID'
          hdiutil verify "$dmg" >/dev/null

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        name: Upload Apple-signed ZTC release payload
        with:
          name: ${{ needs.validate.outputs.release_tag }}-apple-signed
          path: payload/
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary Apple identity
        if: always()
        shell: bash
        run: |
          if [[ -n "${ZTERM_APPLE_KEYCHAIN:-}" ]]; then
            security delete-keychain "$ZTERM_APPLE_KEYCHAIN" || true
          fi
          rm -f \
            "$RUNNER_TEMP"/zterm-developer-id.p12 \
            "$RUNNER_TEMP"/AuthKey_*.p8

  verify-signed:
    name: Smoke-test the signed application without credentials
    needs:
      - validate
      - apple-sign
    runs-on: macos-15
    permissions:
      contents: read
    env:
      RELEASE_CHANNEL: ${{ needs.validate.outputs.channel }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.validate.outputs.release_tag }}-apple-signed
          path: payload

      - name: Verify and launch the exact signed application
        shell: bash
        run: |
          set -euo pipefail
          mkdir app-smoke
          tar -xzf payload/ztc.app.tar.gz -C app-smoke
          app="$GITHUB_WORKSPACE/app-smoke/ztc.app"
          executable="$app/Contents/MacOS/ZTerm"
          dmg="$GITHUB_WORKSPACE/payload/ztc_${RELEASE_VERSION}_aarch64.dmg"
          codesign --verify --deep --strict --verbose=2 "$app"
          hdiutil verify "$dmg" >/dev/null
          [[ "$($executable --version)" == "zterm-$RELEASE_VERSION" ]]
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app" 2>&1 \
            | grep -F 'source=Notarized Developer ID'
          codesign --verify --strict --verbose=2 "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg" 2>&1 \
            | grep -F 'source=Notarized Developer ID'

  sign:
    name: Sign updater payload in an isolated runner
    needs:
      - validate
      - apple-sign
      - verify-signed
    runs-on: ubuntu-24.04
    environment:
      name: zterm-updater-${{ needs.validate.outputs.channel }}
    permissions:
      contents: read
    env:
      RELEASE_CHANNEL: ${{ needs.validate.outputs.channel }}
      RELEASE_DATE: ${{ needs.validate.outputs.requested_at }}
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Epoch-ML/ztc-releases
          ref: bedcdd03c6358268253ad8bf8d465427ee90c69e
          path: release-index
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Epoch-ML/ztc-releases
          ref: ${{ needs.validate.outputs.release_target_sha }}
          path: request-index
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: release-index/package-lock.json

      - name: Install locked signer and verifier
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund --prefix release-index
          npm audit --audit-level=moderate --prefix release-index
          verifier_archive="$RUNNER_TEMP/minisign-0.12-linux.tar.gz"
          verifier_root="$RUNNER_TEMP/zterm-release-tools"
          mkdir -p "$verifier_root"
          curl --fail --location --silent --show-error \
            --retry 3 --retry-all-errors --proto '=https' --tlsv1.2 \
            https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz \
            --output "$verifier_archive"
          echo \
            "9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  $verifier_archive" \
            | sha256sum -c -
          tar -xzf "$verifier_archive" -C "$verifier_root"
          install -m 755 \
            "$verifier_root/minisign-linux/x86_64/minisign" \
            "$verifier_root/minisign"
          [[ "$("$verifier_root/minisign" -v 2>&1)" == *"0.12"* ]]
          echo "$verifier_root" >>"$GITHUB_PATH"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.validate.outputs.release_tag }}-apple-signed
          path: unsigned

      - name: Validate unsigned payload
        shell: bash
        run: |
          set -euo pipefail
          archive_candidates=(unsigned/ztc.app.tar.gz)
          dmg_candidates=(unsigned/ztc_*_aarch64.dmg)
          [[ ${#archive_candidates[@]} -eq 1 && -s "${archive_candidates[0]}" ]]
          [[ ${#dmg_candidates[@]} -eq 1 && -s "${dmg_candidates[0]}" ]]
          [[ "$(basename "${dmg_candidates[0]}")" == "ztc_${RELEASE_VERSION}_aarch64.dmg" ]]

      - name: Require updater signing credential
        env:
          PREVIEW_PRIVATE_KEY: ${{ secrets.ZTERM_PREVIEW_UPDATE_SIGNING_PRIVATE_KEY }}
          PREVIEW_PRIVATE_KEY_PASSWORD: ${{ secrets.ZTERM_PREVIEW_UPDATE_SIGNING_PRIVATE_KEY_PASSWORD }}
          STABLE_PRIVATE_KEY: ${{ secrets.ZTERM_STABLE_UPDATE_SIGNING_PRIVATE_KEY }}
          STABLE_PRIVATE_KEY_PASSWORD: ${{ secrets.ZTERM_STABLE_UPDATE_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_CHANNEL" == "stable" ]]; then
            private_key="$STABLE_PRIVATE_KEY"
            private_key_password="$STABLE_PRIVATE_KEY_PASSWORD"
            credential_name="ZTERM_STABLE_UPDATE_SIGNING_PRIVATE_KEY"
          else
            private_key="$PREVIEW_PRIVATE_KEY"
            private_key_password="$PREVIEW_PRIVATE_KEY_PASSWORD"
            credential_name="ZTERM_PREVIEW_UPDATE_SIGNING_PRIVATE_KEY"
          fi
          [[ -n "$private_key" ]] || {
            echo "::error::$credential_name is unavailable"
            exit 1
          }
          [[ -n "$private_key_password" ]] || {
            echo "::error::${credential_name}_PASSWORD is unavailable"
            exit 1
          }

      - name: Sign and verify updater archive
        env:
          PREVIEW_PRIVATE_KEY: ${{ secrets.ZTERM_PREVIEW_UPDATE_SIGNING_PRIVATE_KEY }}
          PREVIEW_PRIVATE_KEY_PASSWORD: ${{ secrets.ZTERM_PREVIEW_UPDATE_SIGNING_PRIVATE_KEY_PASSWORD }}
          STABLE_PRIVATE_KEY: ${{ secrets.ZTERM_STABLE_UPDATE_SIGNING_PRIVATE_KEY }}
          STABLE_PRIVATE_KEY_PASSWORD: ${{ secrets.ZTERM_STABLE_UPDATE_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_CHANNEL" == "stable" ]]; then
            private_key="$STABLE_PRIVATE_KEY"
            private_key_password="$STABLE_PRIVATE_KEY_PASSWORD"
          else
            private_key="$PREVIEW_PRIVATE_KEY"
            private_key_password="$PREVIEW_PRIVATE_KEY_PASSWORD"
          fi
          mkdir payload
          cp unsigned/ztc.app.tar.gz payload/ztc.app.tar.gz
          cp "unsigned/ztc_${RELEASE_VERSION}_aarch64.dmg" \
            "payload/ztc_${RELEASE_VERSION}_aarch64.dmg"
          TAURI_PRIVATE_KEY="$private_key" \
          TAURI_PRIVATE_KEY_PASSWORD="$private_key_password" \
            release-index/node_modules/.bin/tauri signer sign \
              payload/ztc.app.tar.gz
          [[ -s payload/ztc.app.tar.gz.sig ]]
          minisign -Vm payload/ztc.app.tar.gz \
            -x <(openssl base64 -d -A -in payload/ztc.app.tar.gz.sig) \
            -p <(openssl base64 -d -A \
              -in "release-index/updater-$RELEASE_CHANNEL.pubkey")

      - name: Build and verify immutable signed release payload
        shell: bash
        run: |
          set -euo pipefail
          archive_name="ztc.app.tar.gz"
          signature_name="ztc.app.tar.gz.sig"
          dmg_name="ztc_${RELEASE_VERSION}_aarch64.dmg"
          archive_sha="$(sha256sum "payload/$archive_name" | cut -d' ' -f1)"
          signature_sha="$(sha256sum "payload/$signature_name" | cut -d' ' -f1)"
          dmg_sha="$(sha256sum "payload/$dmg_name" | cut -d' ' -f1)"
          signature="$(tr -d '\r\n' <"payload/$signature_name")"
          [[ "$signature" =~ ^[0-9A-Za-z+/]+=*$ ]]
          archive_url="$(
            node release-index/scripts/release-asset-url.mjs \
              "Epoch-ML/ztc-releases" "$RELEASE_TAG" "$archive_name"
          )"
          apple_notarized=true

          printf '%s  %s\n' "$archive_sha" "$archive_name" \
            >payload/checksums.txt
          printf '%s  %s\n' "$signature_sha" "$signature_name" \
            >>payload/checksums.txt
          printf '%s  %s\n' "$dmg_sha" "$dmg_name" \
            >>payload/checksums.txt
          LC_ALL=C sort -o payload/checksums.txt payload/checksums.txt
          jq -n \
            --arg archive_name "$archive_name" \
            --arg archive_sha "$archive_sha" \
            --arg channel "$RELEASE_CHANNEL" \
            --arg dmg_name "$dmg_name" \
            --arg dmg_sha "$dmg_sha" \
            --arg signature_name "$signature_name" \
            --arg signature_sha "$signature_sha" \
            --arg source_sha "$SOURCE_SHA" \
            --arg version "$RELEASE_VERSION" \
            --argjson apple_notarized "$apple_notarized" \
            '{
              schema_version: 1,
              product: "ZTC",
              version: $version,
              channel: $channel,
              platform: "darwin-aarch64",
              bundle_identifier: "dev.zerg.zterm",
              source_sha: $source_sha,
              apple_notarized: $apple_notarized,
              artifacts: [
                {name: $archive_name, sha256: $archive_sha},
                {name: $signature_name, sha256: $signature_sha},
                {name: $dmg_name, sha256: $dmg_sha}
              ]
            }' >payload/release-metadata.json
          jq -n \
            --arg archive_sha "$archive_sha" \
            --arg archive_url "$archive_url" \
            --arg notes "ZTC $RELEASE_CHANNEL release from source $SOURCE_SHA." \
            --arg pub_date "$RELEASE_DATE" \
            --arg signature "$signature" \
            --arg version "$RELEASE_VERSION" \
            '{
              schema_version: 1,
              product: "ZTC",
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": {
                  sha256: $archive_sha,
                  signature: $signature,
                  url: $archive_url
                }
              }
            }' >payload/latest.json

          tar -xOzf unsigned/ztc.app.tar.gz ztc.app/Contents/Resources/ztc-runtime.json > "$RUNNER_TEMP/ztc-runtime.json"
          node release-index/scripts/build-public-release.mjs "request-index/requests/$RELEASE_TAG.json" "$RUNNER_TEMP/ztc-runtime.json" payload
          (cd payload && sha256sum -c checksums.txt)
          jq -e \
            --arg channel "$RELEASE_CHANNEL" \
            --arg sha "$SOURCE_SHA" \
            --arg version "$RELEASE_VERSION" \
            '.product == "ZTC" and .version == $version and .channel == $channel and .source_sha == $sha and .platform == "darwin-aarch64" and .bundle_identifier == "dev.zerg.zterm"' \
            payload/release-metadata.json >/dev/null
          jq -e \
            --arg version "$RELEASE_VERSION" \
            '.schema_version == 1 and .product == "ZTC" and .version == $version and (.platforms["darwin-aarch64"].signature | length > 0)' \
            payload/latest.json >/dev/null

      - name: Sign public release catalog for this channel
        env:
          PREVIEW_PRIVATE_KEY: ${{ secrets.ZTERM_PREVIEW_UPDATE_SIGNING_PRIVATE_KEY }}
          PREVIEW_PRIVATE_KEY_PASSWORD: ${{ secrets.ZTERM_PREVIEW_UPDATE_SIGNING_PRIVATE_KEY_PASSWORD }}
          STABLE_PRIVATE_KEY: ${{ secrets.ZTERM_STABLE_UPDATE_SIGNING_PRIVATE_KEY }}
          STABLE_PRIVATE_KEY_PASSWORD: ${{ secrets.ZTERM_STABLE_UPDATE_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_CHANNEL" == stable ]]; then private_key="$STABLE_PRIVATE_KEY"; private_key_password="$STABLE_PRIVATE_KEY_PASSWORD"; else private_key="$PREVIEW_PRIVATE_KEY"; private_key_password="$PREVIEW_PRIVATE_KEY_PASSWORD"; fi
          TAURI_PRIVATE_KEY="$private_key" TAURI_PRIVATE_KEY_PASSWORD="$private_key_password" release-index/node_modules/.bin/tauri signer sign payload/release.json
          minisign -Vm payload/release.json -x <(openssl base64 -d -A -in payload/release.json.sig) -p <(openssl base64 -d -A -in "release-index/updater-$RELEASE_CHANNEL.pubkey")

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        name: Upload signed ZTC release payload
        with:
          name: ${{ needs.validate.outputs.release_tag }}
          path: payload/
          if-no-files-found: error
          retention-days: 14
